/* ===========================================================================
   NAVEGACIÓN
=========================================================================== */
let bloqueo = false;
function ir(delta){
  direccion = delta;
  const lista = pasos();
  E.paso = Math.max(-1, Math.min(lista.length - 1, E.paso + delta));
  guardar(); render();
}
function avanzarSolo(){
  if(bloqueo) return;
  bloqueo = true;
  setTimeout(() => { bloqueo = false; ir(1); }, reduce() ? 120 : 260);
}
function marcar(sel){
  app.querySelectorAll('[role="radio"]').forEach(b => {
    const on = b === sel; b.classList.toggle('sel', on); b.setAttribute('aria-checked', on);
  });
  const s = app.querySelector('[data-act="sig"]'); if(s) s.disabled = false;
}
function verResultado(){
  const inp = document.getElementById('nombre');
  if(inp) E.nombre = inp.value.slice(0, 40);
  if(E.r.some(v => v === null)){
    // por si se llegó aquí con alguna afirmación sin contestar
    E.paso = pasos().indexOf('q' + E.r.indexOf(null)); guardar(); return render();
  }
  E.fin = true; guardar(); render();
}

app.addEventListener('click', ev => {
  const b = ev.target.closest('button, a'); if(!b) return;
  if(b.dataset.perfil){
    const cambia = E.perfil !== b.dataset.perfil;
    E.perfil = b.dataset.perfil;
    if(cambia) E.edad = null;
    marcar(b); guardar(); return avanzarSolo();
  }
  if(b.dataset.edad !== undefined){ E.edad = +b.dataset.edad; marcar(b); guardar(); return avanzarSolo(); }
  if(b.dataset.v){
    const i = +pasos()[E.paso].slice(1);
    E.r[i] = +b.dataset.v; marcar(b); guardar(); return avanzarSolo();
  }
  const act = b.dataset.act;
  if(act === 'empezar'){ direccion = 1; if(E.paso < 0) E.paso = 0; guardar(); render(); }
  else if(act === 'reiniciar'){ E = nuevoEstado(); borrar(); E.paso = 0; direccion = 1; render(); }
  else if(act === 'atras'){ ir(-1); }
  else if(act === 'sig'){ ir(1); }
  else if(act === 'ver'){ verResultado(); }
  else if(act === 'repetir'){ E = nuevoEstado(); borrar(); direccion = 1; render(); }
  else if(act === 'png'){ exportarPNG(b); }
  else if(act === 'cerrarvec'){ const pnl = document.getElementById('vecPanel'); if(pnl){ pnl.hidden = true; pnl.innerHTML = ''; } app.querySelectorAll('.vm').forEach(x => x.setAttribute('aria-expanded', 'false')); }
  else if(b.dataset.vec !== undefined){ abrirVecina(b); }
});

document.addEventListener('keydown', ev => {
  if(E.fin || E.paso < 0 || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const id = pasos()[E.paso];
  if(id === 'nombre'){ if(ev.key === 'Enter'){ ev.preventDefault(); verResultado(); } return; }
  const k = ev.key.toUpperCase();
  let objetivo = null;
  if(id && id.charAt(0) === 'q' && /^[1-5]$/.test(k)) objetivo = app.querySelector('[data-v="' + k + '"]');
  if((id === 'perfil' || id === 'edad' || id === 'edad3') && /^[A-F]$/.test(k)){
    const lista = app.querySelectorAll('.opt'); objetivo = lista['ABCDEF'.indexOf(k)] || null;
  }
  if(objetivo){ ev.preventDefault(); objetivo.click(); return; }
  if(ev.key === 'Enter' && !ev.target.closest('button')){
    const s = app.querySelector('[data-act="sig"]:not([disabled])'); if(s){ ev.preventDefault(); s.click(); }
  }
  if(ev.key === 'ArrowLeft' && E.paso >= 0 && !ev.target.closest('input')) ir(-1);
});

/* ===========================================================================
   EXPORT PNG 2x · lienzo fuera del DOM, solo para exportar
=========================================================================== */
const W = 1080, S = 2, H_BORRADOR = 2800, H_MIN = 1350;

function envolver(ctx, texto, maxW){
  const palabras = String(texto).split(/\s+/); const lineas = []; let linea = '';
  palabras.forEach(p => {
    const prueba = linea ? linea + ' ' + p : p;
    if(ctx.measureText(prueba).width > maxW && linea){ lineas.push(linea); linea = p; } else linea = prueba;
  });
  if(linea) lineas.push(linea);
  return lineas;
}
function texto(ctx, t, x, y, maxW, lh){
  const l = envolver(ctx, t, maxW); l.forEach((s, i) => ctx.fillText(s, x, y + i * lh)); return y + l.length * lh;
}
function rr(ctx, x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

async function exportarPNG(boton){
  const original = boton.textContent;
  boton.textContent = 'Generando…';
  try{
    if(document.fonts){
      await Promise.all(['700 60px Fraunces','600 30px Fraunces','400 20px "Hanken Grotesk"','600 20px Archivo','700 20px Archivo','600 16px "IBM Plex Mono"']
        .map(f => document.fonts.load(f).catch(() => null)));
    }
    const R = calcular();
    const fam = E.perfil === 'familia';
    const nom = E.nombre.trim();

    const cv = document.createElement('canvas');
    cv.width = W * S; cv.height = H_BORRADOR * S;
    const ctx = cv.getContext('2d');
    if(!ctx) throw new Error('sin contexto 2d');
    ctx.scale(S, S); ctx.textBaseline = 'top';

    ctx.fillStyle = '#171511'; ctx.fillRect(0, 0, W, H_BORRADOR);
    let gr = ctx.createRadialGradient(140, -40, 10, 140, -40, 760);
    gr.addColorStop(0, 'rgba(221,167,62,.16)'); gr.addColorStop(1, 'rgba(221,167,62,0)');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, 900);
    gr = ctx.createRadialGradient(W, 80, 10, W, 80, 600);
    gr.addColorStop(0, 'rgba(181,83,42,.12)'); gr.addColorStop(1, 'rgba(181,83,42,0)');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, 900);

    const M = 84, maxW = W - M * 2;
    let y = 92;

    ctx.fillStyle = '#DDA73E'; ctx.font = '600 17px "IBM Plex Mono", monospace';
    if('letterSpacing' in ctx) ctx.letterSpacing = '4px';
    ctx.fillText('SINGULAR CLUB · ¿CÓMO FUNCIONA TU MENTE?', M, y);
    if('letterSpacing' in ctx) ctx.letterSpacing = '0px';
    y += 56;

    ctx.fillStyle = '#F2EFE6'; ctx.font = '700 62px Fraunces, Georgia, serif';
    const t = nom ? 'Resultados de ' + nom : (fam ? 'Sus resultados' : 'Mis resultados');
    y = texto(ctx, t, M, y, maxW, 70) + 40;

    // bloque global
    const gy = y, gh = 210;
    rr(ctx, M, gy, maxW, gh, 28); ctx.fillStyle = '#1E1B17'; ctx.fill();
    ctx.save(); rr(ctx, M, gy, maxW, gh, 28); ctx.clip();
    const halo = ctx.createRadialGradient(M + 118, gy + gh / 2, 10, M + 118, gy + gh / 2, 260);
    halo.addColorStop(0, hexA(R.cat.c, .22)); halo.addColorStop(1, hexA(R.cat.c, 0));
    ctx.fillStyle = halo; ctx.fillRect(M, gy, maxW, gh); ctx.restore();
    rr(ctx, M, gy, maxW, gh, 28);
    ctx.lineWidth = 1.5; ctx.strokeStyle = hexA(R.cat.c, .55); ctx.stroke();
    const cx = M + 118, cy = gy + gh / 2, rad = 72;
    ctx.lineWidth = 11; ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(242,239,230,.09)'; ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2); ctx.stroke();
    const lg = ctx.createLinearGradient(cx - rad, cy - rad, cx + rad, cy + rad);
    lg.addColorStop(0, R.cat.c); lg.addColorStop(1, R.cat.l);
    ctx.strokeStyle = lg; ctx.shadowColor = hexA(R.cat.c, .7); ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.arc(cx, cy, rad, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max((R.total - 30) / 120, .01)); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = R.cat.l; ctx.font = '700 54px Fraunces, Georgia, serif';
    ctx.shadowColor = hexA(R.cat.c, .6); ctx.shadowBlur = 18;
    ctx.fillText(String(R.total), cx, cy - 6); ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(242,239,230,.45)'; ctx.font = '600 13px "IBM Plex Mono", monospace';
    ctx.fillText('DE 150', cx, cy + 32);
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    const tx = M + 236, tw = maxW - 236 - 30;
    ctx.fillStyle = R.cat.l; ctx.font = '600 14px "IBM Plex Mono", monospace';
    if('letterSpacing' in ctx) ctx.letterSpacing = '3px';
    ctx.fillText(fam ? 'SU PERFIL' : 'MI PERFIL', tx, gy + 50);
    if('letterSpacing' in ctx) ctx.letterSpacing = '0px';
    ctx.fillStyle = '#F2EFE6'; ctx.font = '600 32px Fraunces, Georgia, serif';
    texto(ctx, R.cat.t, tx, gy + 82, tw - 170, 40);
    // personaje del nivel, a la derecha de la tarjeta
    try{
      const img = new Image();
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(cerebro(CATEGORIAS.indexOf(R.cat), 200, 6, { anim:false }));
      await img.decode();
      const fh = gh + 20, fw = fh * 212 / 252;
      ctx.save(); rr(ctx, M, gy, maxW, gh, 28); ctx.clip();
      ctx.drawImage(img, M + maxW - fw - 18, gy - 4, fw, fh);
      ctx.restore();
    }catch(e){}
    ctx.shadowBlur = 0;
    y = gy + gh + 64;

    // dimensiones y desglose
    ctx.fillStyle = 'rgba(242,239,230,.74)'; ctx.font = '600 15px "IBM Plex Mono", monospace';
    if('letterSpacing' in ctx) ctx.letterSpacing = '3.5px';
    ctx.fillText(fam ? 'SUS TRES DIMENSIONES' : 'MIS TRES DIMENSIONES', M, y);
    if('letterSpacing' in ctx) ctx.letterSpacing = '0px';
    y += 50;

    const fila = (f, x0, ancho, grande) => {
      const fs = grande ? 29 : 22;
      ctx.save(); ctx.translate(x0 + 7, y + fs * .6); ctx.rotate(Math.PI / 4);
      ctx.fillStyle = f.l; ctx.shadowColor = f.c; ctx.shadowBlur = 10;
      const q = grande ? 6 : 5; ctx.fillRect(-q, -q, q * 2, q * 2); ctx.restore();
      ctx.fillStyle = grande ? '#F2EFE6' : 'rgba(242,239,230,.86)';
      ctx.font = (grande ? '600 ' : '500 ') + fs + 'px ' + (grande ? 'Fraunces, Georgia, serif' : '"Hanken Grotesk", sans-serif');
      ctx.fillText(f.t, x0 + 28, y);
      ctx.textAlign = 'right';
      ctx.font = '600 ' + (grande ? 18 : 15) + 'px Archivo, sans-serif'; ctx.fillStyle = 'rgba(242,239,230,.4)';
      const deTxt = '/ ' + f.max; ctx.fillText(deTxt, x0 + ancho, y + (grande ? 9 : 6));
      const dw = ctx.measureText(deTxt).width;
      ctx.font = '700 ' + fs + 'px Archivo, sans-serif'; ctx.fillStyle = f.l;
      ctx.fillText(String(f.p), x0 + ancho - dw - 8, y + 2);
      ctx.textAlign = 'left';
      const bh = grande ? 12 : 8, by = y + fs + (grande ? 18 : 14);
      rr(ctx, x0, by, ancho, bh, bh / 2); ctx.fillStyle = 'rgba(242,239,230,.08)'; ctx.fill();
      const bw = Math.max(ancho * f.p / f.max, bh);
      rr(ctx, x0, by, bw, bh, bh / 2);
      const bg = ctx.createLinearGradient(x0, 0, x0 + bw, 0);
      bg.addColorStop(0, f.c); bg.addColorStop(1, f.l);
      ctx.fillStyle = bg; ctx.shadowColor = hexA(f.c, .65); ctx.shadowBlur = grande ? 14 : 8;
      ctx.fill(); ctx.shadowBlur = 0;
      if(f.umbral){
        const ux = x0 + ancho * f.umbral / f.max;
        ctx.fillStyle = 'rgba(242,239,230,.6)'; rr(ctx, ux - 1.5, by - 6, 3, bh + 12, 1.5); ctx.fill();
      }
      y = by + bh + (grande ? 36 : 26);
    };
    R.dims.forEach(d => {
      fila(d, M, maxW, true);
      if(d.subs.length){
        y -= 8;
        d.subs.forEach(x => fila(x, M + 40, maxW - 40, false));
        y += 10;
      }
    });

    y += 10;
    ctx.fillStyle = 'rgba(242,239,230,.45)'; ctx.font = '400 18px "Hanken Grotesk", sans-serif';
    y = texto(ctx, 'Es una orientación, no un diagnóstico.', M, y, maxW, 26);
    const dir = urlTest();
    if(dir){
      y += 26;
      const bh2 = 78;
      rr(ctx, M, y, maxW, bh2, 22);
      const gb = ctx.createLinearGradient(M, y, M + maxW, y);
      gb.addColorStop(0, 'rgba(221,167,62,.16)'); gb.addColorStop(1, 'rgba(221,167,62,.04)');
      ctx.fillStyle = gb; ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(221,167,62,.55)'; ctx.stroke();
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(242,239,230,.74)'; ctx.font = '500 20px "Hanken Grotesk", sans-serif';
      const pre = '¿Y tú cómo funcionas? Haz el test en';
      const pw = ctx.measureText(pre).width;
      ctx.font = '700 22px Archivo, sans-serif';
      const dw = ctx.measureText(dir).width;
      if(28 + pw + 10 + dw + 28 <= maxW){
        ctx.font = '500 20px "Hanken Grotesk", sans-serif'; ctx.fillText(pre, M + 28, y + bh2 / 2);
        ctx.fillStyle = '#F0C46A'; ctx.font = '700 22px Archivo, sans-serif'; ctx.fillText(dir, M + 28 + pw + 10, y + bh2 / 2);
      } else {
        ctx.font = '500 18px "Hanken Grotesk", sans-serif'; ctx.fillText(pre, M + 28, y + 24);
        ctx.fillStyle = '#F0C46A'; ctx.font = '700 20px Archivo, sans-serif'; ctx.fillText(dir, M + 28, y + 52);
      }
      ctx.textBaseline = 'top';
      y += bh2;
    }

    const pieY = Math.max(y + 48, H_MIN - 118);
    ctx.strokeStyle = 'rgba(242,239,230,.16)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(M, pieY); ctx.lineTo(W - M, pieY); ctx.stroke();
    ctx.fillStyle = '#DDA73E'; ctx.font = '600 17px "IBM Plex Mono", monospace';
    if('letterSpacing' in ctx) ctx.letterSpacing = '3px';
    ctx.fillText('SINGULAR BY DESIGN', M, pieY + 32);
    const w = ctx.measureText('SINGULAR BY DESIGN').width;
    ctx.fillStyle = 'rgba(242,239,230,.35)';
    ctx.fillText('· LO SINGULAR, EN PLURAL', M + w + 14, pieY + 32);
    if('letterSpacing' in ctx) ctx.letterSpacing = '0px';

    const HF = Math.min(H_BORRADOR, Math.max(H_MIN, Math.round(pieY + 100)));
    const out = document.createElement('canvas');
    out.width = W * S; out.height = HF * S;
    const octx = out.getContext('2d');
    if(!octx) throw new Error('sin contexto 2d');
    octx.drawImage(cv, 0, 0);

    const a = document.createElement('a');
    a.href = out.toDataURL('image/png');
    a.download = AJUSTES.ARCHIVO_PNG;
    document.body.appendChild(a); a.click(); a.remove();
    boton.textContent = 'Guardado ✓';
  }catch(err){
    boton.textContent = 'No se pudo';
  }finally{
    setTimeout(() => { boton.textContent = original; }, 1600);
  }
}

/* ===========================================================================
   ARRANQUE
=========================================================================== */
cargar();
render();
</script>
